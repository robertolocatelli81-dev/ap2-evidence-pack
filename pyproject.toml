[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap2-evidence-pack"
version = "1.2.0"
description = "Self-contained, offline-verifiable dispute evidence for agentic-payment SD-JWT mandates (AP2)"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [{name = "Roberto Locatelli"}]
readme = "README.md"
# 1.1.1: declared, because it was not. `pip install ap2-evidence-pack` produced a package whose import failed with
# ModuleNotFoundError: cryptography — the README told you to install it by hand, which is not the same as a working install.
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/robertolocatelli81-dev/ap2-evidence-pack"

[project.scripts]
ap2-evidence = "ap2_evidence:main"

[tool.setuptools]
py-modules = ["ap2_evidence"]
packages = ["pqcrypto"]
