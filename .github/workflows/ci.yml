name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-26.04' }}   # 3.9 has no build for ubuntu-26.04 (ubuntu-latest from 2026-10-19)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]   # pyproject declares >=3.9: the floor is tested too
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Dependencies — cryptography (Ed25519/P-256 and, from 48, ML-DSA-65 for the hybrid producer signature)"
        run: pip install cryptography
      - name: Unit + conformance tests (every suite in the repo, fail-closed)
        run: |
          set -e
          for t in test_*.py pqcrypto/test_*.py; do echo "== $t"; python "$t"; done
      - name: "Every test in every module is actually collected (a stray unittest.main() once hid 13 tests from CI)"
        run: |
          set -e
          for t in test_*.py pqcrypto/test_*.py; do
            m=$(basename "$t" .py); d=$(dirname "$t")
            direct=$(cd "$d" && python "$(basename "$t")" 2>&1 | sed -n 's/^Ran \([0-9]*\) test.*/\1/p' | tail -1)
            full=$(cd "$d" && python -m unittest "$m" 2>&1 | sed -n 's/^Ran \([0-9]*\) test.*/\1/p' | tail -1)
            echo "$t: as a script $direct, as a module $full"
            if [ "$direct" != "$full" ]; then echo "::error::$t runs $direct tests as a script but $full as a module"; exit 1; fi
          done
      - name: "Gate — build the sample evidence, verify it (exit 0), tamper one artifact, verify again (MUST exit 1)"
        run: |
          set -e
          T=$(mktemp -d); cp -r . "$T"; cd "$T"
          python examples/make_samples.py > /dev/null
          python ap2_evidence.py build out.json checkout=checkout.sdjwt payment=payment.sdjwt > /dev/null
          python ap2_evidence.py verify out.json > /dev/null
          python - <<'PY'
          import json
          with open("out.json") as fh:
              d = json.load(fh)
          v = d["artifacts"][0]["sd_jwt_compact"]
          d["artifacts"][0]["sd_jwt_compact"] = v[:30] + ("A" if v[30] != "A" else "B") + v[31:]
          with open("tampered.json", "w") as fh:
              json.dump(d, fh)
          PY
          if python ap2_evidence.py verify tampered.json > /dev/null; then
            echo "::error::the verifier accepted a tampered evidence pack"; exit 1; fi
          echo "tampered pack rejected (exit 1), intact pack accepted (exit 0)"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"   # OpenSSL >= 3.5: the JS verifier checks ML-DSA-65 too
      - name: "Differential oracle: Python reference vs Node verifier on every vector, hostile file and CLI case"
        run: python verifiers/differential_oracle.py
      - name: "Ablation: the strict layers removed from a copy of the reference must turn the suite red"
        run: bash verifiers/lax_python_ablation.sh
      - name: "Every malformed input gets a VERDICT, never a traceback (with its own crashing-verifier control)"
        run: python verifiers/type_fuzz.py
      - name: "The DISTRIBUTED package, not the repository: build the wheel, install it alone in a clean venv, import and verify a vector"
        run: |
          set -e
          python -m pip install -q build
          python -m build --wheel --outdir /tmp/dist .
          python -m venv /tmp/pkgvenv
          /tmp/pkgvenv/bin/pip install -q /tmp/dist/*.whl          # no other install: the wheel must bring what it needs
          # -I keeps this checkout off sys.path: measured 2026-10-05, without it `python -c` and `python -m` run from the
          # checkout imported ./ap2_evidence.py and ./pqcrypto/sigsuite.py (the repository, not the wheel) and the step was
          # green for the wrong reason. The asserts name the origin, so the step cannot go green on the checkout again.
          /tmp/pkgvenv/bin/python -I - <<'PY'
          import ap2_evidence, sigsuite
          assert ap2_evidence.__file__.startswith("/tmp/pkgvenv/"), ap2_evidence.__file__
          assert sigsuite.__file__.startswith("/tmp/pkgvenv/") and "/ap2_pqcrypto/" in sigsuite.__file__, sigsuite.__file__
          print("import ok", ap2_evidence.EVIDENCE_FORMAT, sigsuite.__file__)
          PY
          /tmp/pkgvenv/bin/python -I -m ap2_evidence verify spec/vectors/ap2/valid_signed.json > /dev/null
          echo "the published package imports and verifies on its own"
      - name: "Wheel — no path shared with PyPI's pqcrypto (1.3.0): the suite ships as ap2_pqcrypto/"
        run: |
          set -e
          unzip -l /tmp/dist/*.whl | grep -q ' ap2_pqcrypto/sigsuite.py'
          if unzip -l /tmp/dist/*.whl | grep -q ' pqcrypto/'; then echo "::error::the wheel ships pqcrypto/"; exit 1; fi
          echo "the wheel ships ap2_pqcrypto/ and no pqcrypto/"

  floor:
    # pyproject declares cryptography >= 48: the floor is measured, not asserted (ML-DSA-65 works from 48.0.0)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install "cryptography==48.0.0"
      - name: Every suite with the declared floor
        run: |
          set -e
          for t in test_*.py pqcrypto/test_*.py; do echo "== $t"; python "$t"; done

  downstream-cryptovalid:
    # cryptovalid-opencore >= 0.18.0 imports `ap2_evidence` from THIS package (its `ap2` extra) and ships no copy.
    # The other side of that link is asked the same question on every change here: build the wheel from this checkout,
    # clone cryptovalid-opencore master and run its AP2 tests against it — a skipped AP2 test is a red, not a green.
    runs-on: ubuntu-26.04
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: "The wheel from this checkout (what cryptovalid installs), alone in a venv with cryptography"
        run: |
          set -e
          python -m pip install -q build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "$RUNNER_TEMP/dist"/*.whl cryptography
      - name: "cryptovalid-opencore master — a clone that ships no ap2_evidence.py and no pqcrypto/ (else its tests would test the copy, not this package)"
        run: |
          set -e
          git clone --quiet --depth 1 https://github.com/robertolocatelli81-dev/cryptovalid-opencore "$RUNNER_TEMP/cvo"
          cd "$RUNNER_TEMP/cvo"
          for f in ap2_evidence.py pqcrypto; do
            if [ -e "$f" ]; then echo "::error::cryptovalid-opencore master ships $f: the clone would shadow this package"; exit 1; fi
          done
          "$RUNNER_TEMP/venv/bin/python" -I -c "import ap2_evidence, sys; assert ap2_evidence.__file__.startswith(sys.prefix), ap2_evidence.__file__; print('ap2_evidence from', ap2_evidence.__file__)"
      - name: "cryptovalid's AP2 suites against this wheel — every AP2 test must RUN"
        working-directory: ${{ runner.temp }}/cvo
        run: |
          set -e
          for t in test_verify_evidence test_mcp test_audit_v1_types test_verifier_depth test_packaging; do
            echo "== $t"
            CV_REQUIRE_CRYPTO=1 "$RUNNER_TEMP/venv/bin/python" -m unittest -v "$t" 2>&1 | tee "$RUNNER_TEMP/$t.log"
            test "${PIPESTATUS[0]}" -eq 0
            if grep -iE "ap2.*\.\.\. skipped" "$RUNNER_TEMP/$t.log"; then echo "::error::$t skipped an AP2 test"; exit 1; fi
          done
      - name: "Gate through cryptovalid's front-end: a pack built here passes `verify_evidence.py ap2` and `auto` (exit 0); tampered, exit 1"
        run: |
          set -e
          T=$(mktemp -d); cp -r . "$T"; cd "$T"
          "$RUNNER_TEMP/venv/bin/python" examples/make_samples.py > /dev/null
          "$RUNNER_TEMP/venv/bin/ap2-evidence" build ev.json checkout=checkout.sdjwt payment=payment.sdjwt > /dev/null
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/cvo/verify_evidence.py" ap2 ev.json > /dev/null
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/cvo/verify_evidence.py" auto ev.json > /dev/null   # needs cvo >= the auto-detect fix
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json
          with open("ev.json") as fh:
              d = json.load(fh)
          v = d["artifacts"][0]["sd_jwt_compact"]
          d["artifacts"][0]["sd_jwt_compact"] = v[:30] + ("A" if v[30] != "A" else "B") + v[31:]
          with open("tampered.json", "w") as fh:
              json.dump(d, fh)
          PY
          if "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/cvo/verify_evidence.py" ap2 tampered.json > /dev/null; then
            echo "::error::cryptovalid's front-end accepted a tampered pack"; exit 1; fi
          echo "pass on the built pack, refusal on the tampered one, through cryptovalid-opencore master"

  third-verifier:
    # The differential oracle compares two verifiers written by the same author: a MISREADING of the specification lands
    # identically in both and they agree. This job asks a stack written by other people — Google's AP2 SDK over the
    # `sd-jwt` reference implementation — the same questions about the same tokens. `sd-jwt` is deliberately NOT pinned:
    # if a future release changes the declared divergence, this job turns red and the declaration gets re-measured
    # instead of quietly staying in the README.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: "Third-party stack (pinned commit of google-agentic-commerce/AP2)"
        run: |
          set -e
          git clone --quiet https://github.com/google-agentic-commerce/AP2 /tmp/ap2sdk
          git -C /tmp/ap2sdk checkout --quiet e1ea56db72a6385bce3e5c1112b3a56ce60acb43
          pip install -q cryptography jwcrypto sd-jwt pydantic
      - name: "Cross-check: the third stack on every vector and every hostile mandate, with its positive controls"
        env:
          AP2_SDK_PATH: /tmp/ap2sdk/code/sdk/python
        run: python verifiers/sdk_crosscheck.py --hostile
      - name: "Ablation: a seeded divergence MUST turn that bench red (a bench that cannot report one proves nothing)"
        env:
          AP2_SDK_PATH: /tmp/ap2sdk/code/sdk/python
          AP2_XCHECK_SEED_DIVERGENCE: "1"
        run: |
          set +e; python verifiers/sdk_crosscheck.py --hostile > /tmp/seeded.txt; rc=$?; set -e
          # Exit alone is not the promise: a crash also exits non-zero. The run must REPORT the seeded divergence.
          if [ "$rc" -eq 0 ] || ! grep -q "SEEDED:" /tmp/seeded.txt; then
            echo "::error::a seeded divergence was not reported (rc=$rc)"; tail -5 /tmp/seeded.txt; exit 1; fi
          echo "seeded divergence reported and exit $rc, as required"
