name: windows-probe
on: {push: {branches: [ci-prova-diag-1.11.0]}}
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults: {run: {shell: bash}}
    strategy: {fail-fast: false, matrix: {python: ["3.9", "3.13"], tools: [with-tools]}}
    steps:
      # the bytes as committed: Git for Windows turns LF into CRLF by default (core.autocrlf=true); the vectors and the
      # files a test compares byte for byte are read as they are in the repository
      - name: check out without line-end conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.tools == 'with-tools'
        with:
          node-version: "24"   # OpenSSL >= 3.5 inside node: the JS verifier checks ML-DSA-65 too
      - name: "Windows: a full volume, the equivalent of Linux's /dev/full (writes there fail with ENOSPC)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = Join-Path $env:RUNNER_TEMP "full.vhdx"
          $s = Join-Path $env:RUNNER_TEMP "full.txt"
          Set-Content $s "create vdisk file=`"$v`" maximum=16 type=fixed`r`nselect vdisk file=`"$v`"`r`nattach vdisk`r`ncreate partition primary`r`nformat fs=fat quick label=AP2FULL`r`nassign letter=Q"
          diskpart /s $s
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path Q:\)) { throw "the full volume was not made (diskpart exit $LASTEXITCODE)" }
          New-Item -ItemType File Q:\sink | Out-Null
          # filled to the last byte by the tests (_ap2_platform.fill_volume), which also free room to put a file there
          python -c "import sys; sys.path.insert(0, '.'); import _ap2_platform as P; P.fill_volume('Q:\\')"
          $full = $false
          try { [IO.File]::WriteAllBytes("Q:\probe", [byte[]](1)) } catch [IO.IOException] { $full = $true }
          if (-not $full) { throw "the volume is not full: a 1-byte file was written" }
          "AP2_FULL_DIR=Q:\" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: python -m pip install --disable-pip-version-check cryptography tomli
      - name: what node sees of a full PIPE_NOWAIT pipe
        run: |
          cat > probe.mjs <<'J'
          import { fstatSync, writeSync } from "node:fs";
          const o = []; const t = (k, f) => { try { const v = f(); o.push(k + " " + v); } catch (e) { o.push(k + " THROW " + e.code + " " + e.message); } };
          t("node", () => process.version);
          t("fstat", () => { const st = fstatSync(2); return "fifo=" + st.isFIFO() + " file=" + st.isFile() + " mode=" + st.mode; });
          for (const len of [1, 100, 5000]) t("write" + len, () => writeSync(2, Buffer.alloc(len, 88), 0, len));
          console.log(o.join("\n"));
          J
          cat > probe.py <<'P'
          import os, subprocess, shutil
          import _ap2_platform as P
          r, w = os.pipe(); P.set_nonblocking(w); tot = 0
          while True:
              try:
                  n = os.write(w, b"P" * 4096)
                  if not n: break
                  tot += n
              except OSError as e:
                  print("filled", tot, repr(e)); break
          p = subprocess.run([shutil.which("node"), "probe.mjs"], stdout=subprocess.PIPE, stderr=w)
          print(tot, p.returncode, p.stdout.decode())
          P
          python probe.py
      - name: tests
        run: |
          rc=0; for t in test_receipt_not_written.py test_ap2_bytes_every_os.py test_ap2_which.py test_js_receipt_pipe.py; do echo "== $t"; python $t || rc=1; done; exit $rc
